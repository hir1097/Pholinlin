<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pho Linlin 點餐系統</title>
    <!-- Telegram WebApp SDK 官方套件 -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* 基礎重置：PC端背景設為灰色 */
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #e0e0e0;
        }

        /* 核心容器：限制最大寬度並置中，模擬手機螢幕 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            max-width: 500px; 
            margin: 0 auto;  
            background: #f8f9fa; 
            color: #333; 
            touch-action: manipulation; 
            -webkit-text-size-adjust: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.15); 
            position: relative;
            overflow: hidden;
        }

        header { 
            background: #fff; 
            border-bottom: 1px solid #eee; 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }

        .lang-switch { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 6px; 
            padding: 10px 10px 6px; 
        }
        .lang-switch button { 
            padding: 5px 10px; 
            border: 1px solid #ddd; 
            border-radius: 20px; 
            background: #fff; 
            color: #666;
            font-size: 11px; 
            font-weight: 500;
            cursor: pointer; 
            transition: all 0.2s;
        }
        .lang-switch button.active {
            background: #ff5722;
            color: #fff;
            border-color: #ff5722;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(255,87,34,0.3);
        }

        /* 桌號 / 狀態提示列 */
        .table-banner {
            background: #fff3e0;
            color: #e65100;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #ffe0b2;
        }
        .table-banner.error {
            background: #ffebee;
            color: #c62828;
            border-top-color: #ffcdd2;
        }

        /* 成功提示橫幅 (status=done) */
        .success-banner {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #c8e6c9;
            animation: fadeIn 0.4s ease;
        }
        
        .main { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            background: #fff; 
            height: calc(100vh - 120px); 
        }
        
        #sidebar { 
            width: 88px; 
            background: #f8f8f8; 
            overflow-y: auto; 
            flex-shrink: 0; 
            border-right: 1px solid #eee; 
            -webkit-overflow-scrolling: touch; 
            padding-bottom: 180px; 
        }

        .tab { 
            padding: 16px 6px; 
            cursor: pointer; 
            border-bottom: 1px solid #eee; 
            font-size: 12px; 
            text-align: center; 
            color: #666; 
            word-break: break-all; 
            min-height: 48px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .tab.active { 
            background: #fff; 
            font-weight: bold; 
            color: #ff5722; 
            border-left: 4px solid #ff5722; 
        }
        
        #content { 
            flex: 1; 
            padding: 12px 14px 180px; 
            overflow-y: auto; 
            background: #fff; 
            -webkit-overflow-scrolling: touch;
        }
        .card { 
            display: flex; 
            gap: 12px; 
            padding: 12px 0; 
            border-bottom: 1px solid #f2f2f2; 
            align-items: center; 
        }
        .item-img { 
            width: 70px; 
            height: 70px; 
            border-radius: 8px; 
            object-fit: cover; 
            background: #f0f0f0; 
            flex-shrink: 0; 
        }
        
        .info { flex: 1; min-width: 0; }
        .name { 
            font-size: 14px; 
            font-weight: 600; 
            display: block; 
            margin-bottom: 4px; 
            line-height: 1.35; 
            word-break: break-word;
        }
        .price { color: #ff5722; font-weight: bold; font-size: 14px; }
        .badge-special {
            display: inline-block;
            background: #ffebee;
            color: #e53935;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        
        .stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .btn-step { 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            border: 1px solid #ff5722; 
            background: #fff; 
            color: #ff5722; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            user-select: none; 
            -webkit-user-select: none; 
            touch-action: manipulation;
            transition: transform 0.1s;
        }
        .btn-step:active { transform: scale(0.9); }
        .btn-step.add { background: #ff5722; color: #fff; }
        .count { font-weight: bold; min-width: 18px; text-align: center; font-size: 14px; }
        
        /* 底部固定結帳區 */
        footer { 
            padding: 10px 14px; 
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
            background: #fff; 
            border-top: 1px solid #eee; 
            box-shadow: 0 -3px 12px rgba(0,0,0,0.08); 
            position: absolute; 
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 101;
        }

        /* 購物車概覽點擊條 */
        .cart-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            cursor: pointer;
            user-select: none;
        }
        .cart-info-left {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
        }
        .cart-view-link {
            font-size: 11px;
            color: #ff5722;
            font-weight: normal;
            text-decoration: underline;
            margin-left: 4px;
        }
        
        /* 備註輸入框 */
        .note-container {
            margin: 6px 0 8px;
        }
        .note-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }
        .note-input:focus {
            border-color: #ff5722;
            background: #fff;
        }

        #btn-order { 
            background: #ff5722; 
            color: #fff; 
            border: none; 
            padding: 13px; 
            border-radius: 30px; 
            width: 100%; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s; 
            box-shadow: 0 3px 8px rgba(255,87,34,0.3);
        }
        #btn-order:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
            box-shadow: none;
        }
        .closed-msg { 
            color: #777; 
            font-size: 12px; 
            text-align: center; 
            margin-top: 6px; 
            font-weight: 500; 
        }

        /* 購物車明細彈窗 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
            animation: fadeIn 0.2s ease;
        }
        .modal-sheet {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 16px 16px 0 0;
            padding: 16px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.25s ease;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .modal-title { font-size: 16px; font-weight: bold; }
        .modal-clear { font-size: 12px; color: #999; cursor: pointer; border: none; background: none; }
        .modal-clear:hover { color: #f44336; }
        .modal-close { font-size: 20px; color: #666; cursor: pointer; border: none; background: none; padding: 0 4px; }
        .modal-body {
            overflow-y: auto;
            flex: 1;
            padding: 10px 0;
        }
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f7f7f7;
        }
        .cart-item-name { font-size: 14px; font-weight: 500; flex: 1; padding-right: 8px; }
        .cart-item-price { color: #ff5722; font-weight: bold; font-size: 14px; margin-right: 12px; }

        /* 外賣平台/房號彈窗 */
        .prompt-modal {
            background: #fff;
            width: 90%;
            max-width: 360px;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            margin: auto;
        }
        .platform-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .platform-btn {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fdfdfd;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .platform-btn:active {
            background: #ff5722;
            color: #fff;
            border-color: #ff5722;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="lang-switch">
        <button id="lang-zh" onclick="setLang('zh')">中文</button>
        <button id="lang-en" onclick="setLang('en')">EN</button>
        <button id="lang-km" onclick="setLang('km')">ខ្មែរ</button>
        <button id="lang-vi" onclick="setLang('vi')">VN</button>
        <button id="lang-ja" onclick="setLang('ja')">日本語</button>
        <button id="lang-ko" onclick="setLang('ko')">한국어</button>
    </div>
    <div id="table-banner" class="table-banner">
        <span id="table-banner-text">📍 載入中...</span>
        <span id="table-mode-badge" style="font-size:11px; opacity:0.8;"></span>
    </div>
    <div id="success-banner" class="success-banner"></div>
</header>

<div class="main">
    <div id="sidebar"></div>
    <div id="content">
        <h2 id="cat-display" style="margin-top:0; font-size: 1.15em; color: #222;"></h2>
        <div id="items-container"></div>
    </div>
</div>

<footer>
    <!-- 購物車概覽點擊條 -->
    <div class="cart-bar" onclick="openCartModal()">
        <div class="cart-info-left">
            <span>🛒</span>
            <span id="cart-count">合計: 0 份</span>
            <span class="cart-view-link" id="cart-view-text">查看明細</span>
        </div>
        <div id="cart-total" style="color:#ff5722; font-size: 1.25em; font-weight: bold;">$0.00</div>
    </div>

    <!-- 客戶備註欄 -->
    <div class="note-container">
        <input type="text" id="order-note" class="note-input" placeholder="備註：如不要香菜、少辣、豆芽燙熟..." maxlength="100">
    </div>

    <button id="btn-order" onclick="startOrderProcess()">點好了，發送訂單</button>
    <div id="closed-info" class="closed-msg"></div>
</footer>

<!-- 購物車明細彈窗 (Cart Modal) -->
<div id="cart-modal" class="modal-overlay" onclick="closeCartModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="cart-modal-title">🛒 已點清單</span>
            <div>
                <button class="modal-clear" onclick="clearCart()" id="cart-clear-text">清空</button>
                <button class="modal-close" onclick="closeCartModal()">&times;</button>
            </div>
        </div>
        <div class="modal-body" id="cart-modal-items">
            <!-- 動態插入已點商品 -->
        </div>
        <div style="border-top: 1px solid #eee; padding-top: 12px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight:bold;" id="cart-modal-total-label">總計:</span>
            <span id="cart-modal-total" style="color:#ff5722; font-size: 1.3em; font-weight:bold;">$0.00</span>
        </div>
    </div>
</div>

<!-- 自訂通用對話彈窗 (取代原生 prompt) -->
<div id="custom-modal" class="modal-overlay">
    <div class="prompt-modal" id="custom-modal-content">
        <!-- 動態填入內容 -->
    </div>
</div>

<script>
// --- 配置區 ---
// 🔒 Google Apps Script 安全中繼站（保護 Bot Token 並自動記錄至 Google 試算表）
const GAS_RELAY_URL = 'https://script.google.com/macros/s/AKfycbxmz1NLo94EoVhqJKW7IT1Psvp5-O5fuBkrH0w-1HeTPpSF_4afjvpUBnnLRDNf6X18Xw/exec';

const OPEN_HOUR = 7; 
const CLOSE_HOUR = 24; 

// 🚨 臨時店休開關：true 為休息（禁止點餐），false 為營業
const IS_CLOSED_TODAY = false; 

// 🛵 臨時外送限制開關：true 為允許外送，false 為暫停外送（針對 table=room 住戶攔截）
const IS_DELIVERY_ENABLED = true; 

// --- 公寓配送配置 ---
const ROOM_DELIVERY_START = 9; 
const ROOM_DELIVERY_END = 24;   
const DELIVERY_FEE = 0.5;       
const MIN_ROOM_AMOUNT = 2.0;    

// --- Telegram WebApp 初始化 ---
const tg = window.Telegram?.WebApp;
const isTG = Boolean(tg && tg.initData);
const tgUser = tg?.initDataUnsafe?.user;

if (tg) {
    try {
        tg.ready();
        tg.expand(); // 自動將小程式撐開至全螢幕
        if (tg.enableClosingConfirmation) tg.enableClosingConfirmation(); // 防誤觸滑動關閉
    } catch(e) {}
}

const urlParams = new URLSearchParams(window.location.search);
let rawTable = urlParams.get('table') || "";
if (!rawTable && isTG) rawTable = "tg"; // 若在 Telegram 內且未帶 table 參數，預設為 tg
const tableNo = rawTable.toLowerCase();
const urlStatus = urlParams.get('status') || "";

let currentLang = urlParams.get('lang') || 'zh';
let currentCatIndex = 0;
let cart = {}; 
let isSubmitting = false; 

const fmtT = (h) => `${h.toString().padStart(2, '0')}:00`;

const i18nMsgs = {
    emergencyClosed: { 
        zh: "📢 WOWNOW搜 PHO Linlin 📢",

    },

function isOpening() {
    if (IS_CLOSED_TODAY) return false; 
    const now = new Date();
    const hour = now.getHours();
    return hour >= OPEN_HOUR && hour < CLOSE_HOUR;
}

function render() {
    // 1. 更新語言選中按鈕樣式
    ['zh', 'en', 'km', 'vi', 'ja', 'ko'].forEach(lang => {
        const btn = document.getElementById(`lang-${lang}`);
        if (btn) {
            btn.className = (lang === currentLang) ? 'active' : '';
        }
    });

    // 2. 備註欄 Placeholder 多語言化
    const noteInput = document.getElementById('order-note');
    if (noteInput) {
        noteInput.placeholder = i18nMsgs.notePlaceholder[currentLang] || i18nMsgs.notePlaceholder.zh;
    }

    // 3. 購物車文字多語言化
    const cartViewText = document.getElementById('cart-view-text');
    if (cartViewText) cartViewText.innerText = i18nMsgs.cartDetails[currentLang] || i18nMsgs.cartDetails.zh;
    const cartModalTitle = document.getElementById('cart-modal-title');
    if (cartModalTitle) cartModalTitle.innerText = i18nMsgs.cartTitle[currentLang] || i18nMsgs.cartTitle.zh;
    const cartClearText = document.getElementById('cart-clear-text');
    if (cartClearText) cartClearText.innerText = i18nMsgs.clearCart[currentLang] || i18nMsgs.clearCart.zh;

    updateTableBanner();

    const sidebar = document.getElementById('sidebar');
    
    // 如果初始選中的分類被隱藏，自動切換到第一個未隱藏的分類
    if (menuData[currentCatIndex] && menuData[currentCatIndex].hidden) {
        const firstVisibleIndex = menuData.findIndex(d => !d.hidden);
        currentCatIndex = firstVisibleIndex !== -1 ? firstVisibleIndex : 0;
    }

    sidebar.innerHTML = menuData.map((data, index) => {
        if (data.hidden) return ''; 
        return `
            <div class="tab ${index === currentCatIndex ? 'active' : ''}" onclick="switchCat(${index})">
                ${data.cat[currentLang] || data.cat.zh}
            </div>
        `;
    }).join('');

    const catTitle = document.getElementById('cat-display');
    catTitle.innerText = menuData[currentCatIndex].cat[currentLang] || menuData[currentCatIndex].cat.zh;

    const container = document.getElementById('items-container');
    container.innerHTML = menuData[currentCatIndex].items.map(item => {
        const count = cart[item.id] || 0;
        const itemName = item.name[currentLang] || item.name.zh;
        return `
            <div class="card">
                <img class="item-img" src="${item.img || 'img/NO.png'}" loading="lazy" onerror="this.src='img/NO.png'">
                <div class="info">
                    ${item.isSwap ? `<span class="badge-special">🔥 特別加購</span>` : ''}
                    <span class="name">${itemName}</span>
                    <span class="price">$${item.price.toFixed(2)}</span>
                </div>
                <div class="stepper">
                    ${count > 0 ? `<button class="btn-step" onclick="updateCart(${item.id}, -1)">-</button>` : ''}
                    ${count > 0 ? `<span class="count">${count}</span>` : ''}
                    <button class="btn-step add" onclick="updateCart(${item.id}, 1)">+</button>
                </div>
            </div>
        `;
    }).join('');

    updateSummary();
}

function updateCart(itemId, delta) {
    if (IS_CLOSED_TODAY) { alert(i18nMsgs.emergencyClosed[currentLang] || i18nMsgs.emergencyClosed.zh); return; }
    if (tableNo === 'room' && !IS_DELIVERY_ENABLED) { alert(i18nMsgs.deliveryDisabled[currentLang] || i18nMsgs.deliveryDisabled.zh); return; }

    const currentCount = cart[itemId] || 0;
    if (delta > 0 && currentCount >= 5) { 
        alert(i18nMsgs.limit5[currentLang] || i18nMsgs.limit5.zh); 
        return; 
    }

    // 🔒【煎蛋換蔥蛋 數量限制】不能超過飯類(801~804)的總數量
    if (itemId === 908 && delta > 0) {
        const totalRice = (cart[801] || 0) + (cart[802] || 0) + (cart[803] || 0) + (cart[804] || 0);
        if (currentCount >= totalRice) {
            alert(currentLang === 'zh' ? `⚠️ 換蔥蛋數量不能超過飯類總數！(目前已點 ${totalRice} 份飯)` : `⚠️ Swap count cannot exceed total rice dishes! (${totalRice} ordered)`);
            return;
        }
    }

    cart[itemId] = currentCount + delta;

    // 🔒【回扣邏輯】若減少飯類導致換蛋數溢出，自動把換蛋數扣回
    const newTotalRice = (cart[801] || 0) + (cart[802] || 0) + (cart[803] || 0) + (cart[804] || 0);
    if ((cart[908] || 0) > newTotalRice) { cart[908] = newTotalRice; }

    if (cart[itemId] <= 0) delete cart[itemId];
    render();
    renderCartModal();
}

function updateSummary() {
    let totalQty = 0;
    let totalPrice = 0;
    
    Object.keys(cart).forEach(id => {
        const it = itemDict[id];
        if (it) {
            totalQty += cart[id];
            totalPrice += cart[id] * it.price;
        }
    });

    const labels = { zh: "合計", en: "Total", km: "សរុប", vi: "Tổng", ja: "合計", ko: "합계" };
    document.getElementById('cart-count').innerText = `${labels[currentLang] || labels.zh}: ${totalQty} 份`;
    document.getElementById('cart-total').innerText = `$${totalPrice.toFixed(2)}`;
    
    const btn = document.getElementById('btn-order');
    const closedInfo = document.getElementById('closed-info');

    const formatH = (h) => h.toString().padStart(2, '0');
    const timeRange = `${formatH(OPEN_HOUR)}:00 - ${formatH(CLOSE_HOUR)}:00`;

    if (IS_CLOSED_TODAY) {
        const closedBtnTexts = { zh: "老闆休假無法外送", en: "Closed Today", km: "ហាងសម្រាកថ្ងៃនេះ", vi: "Hôm nay quán nghỉ", ja: "本日休業", ko: "오늘 휴무" };
        btn.innerText = closedBtnTexts[currentLang] || closedBtnTexts.zh;
        btn.disabled = true;
        closedInfo.innerText = i18nMsgs.emergencyClosed[currentLang] || i18nMsgs.emergencyClosed.zh;
        closedInfo.style.color = "#ff5722";
    } else if (!isOpening()) {
        const closedBtnTexts = { zh: "休息中 (Closed)", en: "Closed Now", km: "បិទឥឡូវនេះ", vi: "Hiện đang đóng cửa", ja: "準備中", ko: "영업 종료" };
        btn.innerText = closedBtnTexts[currentLang] || closedBtnTexts.zh;
        btn.disabled = true;
        const opLabels = { zh: "營業時間", en: "Hours", km: "ម៉ោងលក់ដូរ", vi: "Giờ mở cửa", ja: "営業時間", ko: "영업시간" };
        closedInfo.innerText = `${opLabels[currentLang] || opLabels.zh}: ${timeRange}`;
        closedInfo.style.color = "#ff5722";
    } else if (tableNo === 'room' && !IS_DELIVERY_ENABLED) {
        const noDeliveryBtnTexts = { zh: "今日無法外送", en: "No Delivery", km: "មិនមានសេវាដឹកទេ", vi: "Hôm nay không ship", ja: "本日配達不可", ko: "오늘 배달 불가" };
        btn.innerText = noDeliveryBtnTexts[currentLang] || noDeliveryBtnTexts.zh;
        btn.disabled = true;
        closedInfo.innerText = i18nMsgs.deliveryDisabled[currentLang] || i18nMsgs.deliveryDisabled.zh;
        closedInfo.style.color = "#ff5722";
    } else {
        const btnTexts = { zh: "點好了，發送訂單", en: "Send Order", km: "បញ្ជាទិញឥឡូវនេះ", vi: "Đặt hàng ngay", ja: "注文を送信する", ko: "주문하기" };
        btn.innerText = isSubmitting ? "正在發送..." : (btnTexts[currentLang] || btnTexts.zh);
        btn.disabled = totalQty === 0 || isSubmitting;
        const opLabels = { zh: "營業時間", en: "Hours", km: "ម៉ោងលក់ដូរ", vi: "Giờ mở cửa", ja: "営業時間", ko: "영업시간" };
        closedInfo.innerText = `${opLabels[currentLang] || opLabels.zh}: ${timeRange}`;
        closedInfo.style.color = "#777";
    }
    closedInfo.style.display = 'block';
}

// --- 購物車彈窗功能 ---
function openCartModal() {
    renderCartModal();
    document.getElementById('cart-modal').style.display = 'flex';
}

function closeCartModal(e) {
    if (e && e.target !== e.currentTarget && e.target.className !== 'modal-close') return;
    document.getElementById('cart-modal').style.display = 'none';
}

function clearCart() {
    if (Object.keys(cart).length === 0) return;
    const confirmMsg = currentLang === 'zh' ? "確定要清空已選餐點嗎？" : "Clear all selected items?";
    if (confirm(confirmMsg)) {
        cart = {};
        render();
        renderCartModal();
        closeCartModal();
    }
}

function renderCartModal() {
    const container = document.getElementById('cart-modal-items');
    const itemIds = Object.keys(cart);
    let total = 0;

    if (itemIds.length === 0) {
        const emptyMsg = currentLang === 'zh' ? "購物車是空的，快去選購美味餐點吧！" : "Your cart is empty!";
        container.innerHTML = `<div style="text-align:center; padding:30px 0; color:#999;">${emptyMsg}</div>`;
        document.getElementById('cart-modal-total').innerText = "$0.00";
        return;
    }

    container.innerHTML = itemIds.map(id => {
        const item = itemDict[id];
        if (!item) return '';
        const qty = cart[id];
        const sub = qty * item.price;
        total += sub;
        const name = item.name[currentLang] || item.name.zh;
        return `
            <div class="cart-item-row">
                <div class="cart-item-name">${name}</div>
                <div class="cart-item-price">$${sub.toFixed(2)}</div>
                <div class="stepper">
                    <button class="btn-step" onclick="updateCart(${item.id}, -1)">-</button>
                    <span class="count">${qty}</span>
                    <button class="btn-step add" onclick="updateCart(${item.id}, 1)">+</button>
                </div>
            </div>
        `;
    }).join('');

    document.getElementById('cart-modal-total').innerText = `$${total.toFixed(2)}`;
}

// --- 訂單流程主邏輯 ---
function startOrderProcess() {
    const validTables = ["1", "2", "3", "4", "5", "out", "room", "app", "tg"];
    if (!validTables.includes(tableNo)) { alert(i18nMsgs.invalidTable[currentLang] || i18nMsgs.invalidTable.en); return; }
    if (IS_CLOSED_TODAY || !isOpening()) { alert(i18nMsgs.emergencyClosed[currentLang] || i18nMsgs.closed[currentLang]); return; }
    if (tableNo === 'room' && !IS_DELIVERY_ENABLED) { alert(i18nMsgs.deliveryDisabled[currentLang] || i18nMsgs.deliveryDisabled.zh); return; }

    // 公寓外送時段與金額檢查
    if (tableNo === 'room') {
        const now = new Date();
        const hour = now.getHours();
        if (hour < ROOM_DELIVERY_START || hour >= ROOM_DELIVERY_END) {
            alert(i18nMsgs.roomTimeErr[currentLang] || i18nMsgs.roomTimeErr.en);
            return;
        }

        let subTotalCheck = 0;
        Object.keys(cart).forEach(id => {
            const it = itemDict[id];
            if (it) subTotalCheck += cart[id] * it.price;
        });

        if (subTotalCheck < MIN_ROOM_AMOUNT) {
            alert(i18nMsgs.minAmountErr[currentLang] || i18nMsgs.minAmountErr.en);
            return;
        }

        // 彈出房號輸入對話框
        showRoomPrompt();
        return;
    }

    // 外賣平台選擇
    if (tableNo === 'app') {
        showPlatformPicker();
        return;
    }

    // 一般內用或外帶
    executeSubmitOrder();
}

function showRoomPrompt() {
    const modal = document.getElementById('custom-modal');
    const content = document.getElementById('custom-modal-content');
    const savedRoom = localStorage.getItem('pholinlin_room_no') || "";

    const title = i18nMsgs.inputRoomTitle[currentLang] || i18nMsgs.inputRoomTitle.zh;
    const confirmText = currentLang === 'zh' ? "確認下單" : "Confirm Order";
    const cancelText = currentLang === 'zh' ? "取消" : "Cancel";

    content.innerHTML = `
        <h3 style="margin-top:0; font-size:16px;">🏢 公寓外送資訊</h3>
        <p style="font-size:13px; color:#666; margin-bottom:15px;">${title}</p>
        <input type="text" id="modal-room-input" value="${savedRoom}" placeholder="例如: 802 / Room 802" 
               style="width:100%; padding:10px; font-size:16px; border:1px solid #ddd; border-radius:8px; text-align:center; outline:none; margin-bottom:18px;">
        <div style="display:flex; gap:10px;">
            <button onclick="closeCustomModal()" style="flex:1; padding:10px; border:1px solid #ccc; background:#fff; border-radius:8px; font-size:14px; cursor:pointer;">${cancelText}</button>
            <button onclick="submitRoomOrder()" style="flex:1; padding:10px; border:none; background:#ff5722; color:#fff; border-radius:8px; font-size:14px; font-weight:bold; cursor:pointer;">${confirmText}</button>
        </div>
    `;
    modal.style.display = 'flex';
    setTimeout(() => {
        const inp = document.getElementById('modal-room-input');
        if (inp) inp.focus();
    }, 100);
}

function submitRoomOrder() {
    const inp = document.getElementById('modal-room-input');
    const val = inp ? inp.value.trim() : "";
    if (!val) {
        alert(currentLang === 'zh' ? "⚠️ 房號不能為空！" : "⚠️ Room number cannot be empty!");
        return;
    }
    localStorage.setItem('pholinlin_room_no', val);
    closeCustomModal();
    executeSubmitOrder({ roomInfo: val });
}

function showPlatformPicker() {
    const modal = document.getElementById('custom-modal');
    const content = document.getElementById('custom-modal-content');
    
    content.innerHTML = `
        <h3 style="margin-top:0; font-size:16px;">🛵 選擇外賣平台</h3>
        <p style="font-size:13px; color:#666;">請點選本訂單對應的外賣平台：</p>
        <div class="platform-btn-grid">
            <button class="platform-btn" onclick="selectPlatform('Grab')">1. Grab</button>
            <button class="platform-btn" onclick="selectPlatform('Wownow')">2. Wownow</button>
            <button class="platform-btn" onclick="selectPlatform('Egets')">3. Egets</button>
            <button class="platform-btn" onclick="selectPlatform('Foodpanda')">4. Foodpanda</button>
            <button class="platform-btn" style="grid-column: span 2; background:#fff8e1; border-color:#ffe082;" onclick="selectPlatform('PassApp')">5. PassApp</button>
        </div>
        <button onclick="closeCustomModal()" style="margin-top:15px; width:100%; padding:9px; border:1px solid #ddd; background:#fff; border-radius:8px; cursor:pointer;">取消</button>
    `;
    modal.style.display = 'flex';
}

function selectPlatform(name) {
    closeCustomModal();
    executeSubmitOrder({ platform: name });
}

function closeCustomModal() {
    document.getElementById('custom-modal').style.display = 'none';
}

async function executeSubmitOrder(extraParams = {}) {
    if (isSubmitting) return;
    isSubmitting = true;
    updateSummary();

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000); 

    try {
        const roomInfo = extraParams.roomInfo || localStorage.getItem('pholinlin_room_no') || "";
        const selectedPlatform = extraParams.platform || "";
        const customerNote = (document.getElementById('order-note')?.value || "").trim();

        // 判斷訂單來源與細節（給試算表專用）
        let orderType = "內用";
        let orderTarget = `${tableNo} 號桌`;

        if (tableNo === 'room') {
            orderType = "公寓外送";
            orderTarget = `房號 ${roomInfo}`;
        } else if (tableNo === 'app') {
            orderType = "外賣平台";
            orderTarget = selectedPlatform;
        } else if (tableNo === 'out') {
            orderType = "外帶打包";
            orderTarget = "打包自取";
        } else if (tableNo === 'tg') {
            orderType = "Telegram小程式";
            orderTarget = tgUser ? `@${tgUser.username || tgUser.first_name}` : "TG用戶";
        }

        let tgDisplayName = tgUser ? `${tgUser.first_name} (@${tgUser.username || '無'})` : "TG用戶";
        let displayTable = (tableNo === 'room') ? `🏢 房間 / Phòng: ${roomInfo}` : 
                           (tableNo === 'app') ? `🛵 外賣平台 / App: ${selectedPlatform}` :
                           (tableNo === 'out') ? "🥡 打包 / Mang về" : 
                           (tableNo === 'tg') ? `🤖 Telegram: ${tgDisplayName}` :
                           `🪑 桌號 / Bàn: ${tableNo}`;

        let message = (tgUser ? `👤 訂購人: ${tgDisplayName}\n` : "") + 
                      `📍 ${displayTable}\n⏰ Time: ${new Date().toLocaleTimeString()}\n🔔 New Order!\n--------------------------\n`;
        
        let subTotal = 0;
        let foodQty = 0;
        let drinkQty = 0;
        const summaryList = [];

        Object.keys(cart).forEach(id => {
            const item = itemDict[id];
            if (!item) return;
            const qty = cart[id];
            const itemTotal = qty * item.price;

            const cleanNameVi = item.name.vi ? item.name.vi.replace(/<[^>]*>/g, '') : item.name.zh;
            const cleanNameZh = item.name.zh.replace(/<[^>]*>/g, '');

            message += `▪️ ${cleanNameVi} (${cleanNameZh})\n   SL: ${qty}\n\n`;
            summaryList.push(`${cleanNameZh} x${qty}`);
            subTotal += itemTotal;

            if (item.id >= 1000) {
                drinkQty += qty;
            } else if (item.id !== 908) {
                foodQty += qty;
            }
        });

        let finalTotal = subTotal;
        message += `--------------------------\n🍲 餐點 / Món ăn: ${foodQty}\n🥤 飲料 / Đồ uống: ${drinkQty}\n`;

        if (tableNo === 'room') {
            finalTotal += DELIVERY_FEE;
            message += `🚚 Delivery Fee / Phí ship: $${DELIVERY_FEE.toFixed(2)}\n`;
        }
        message += `💰 Total: $${finalTotal.toFixed(2)}`;

        if (customerNote) {
            message += `\n📝 備註 / Ghi chú: ${customerNote}`;
        }

        // 🔒 安全送往 Google Apps Script 中繼站
        const payload = {
            message: message,
            orderType: orderType,
            orderTarget: orderTarget,
            summary: summaryList.join(", "),
            total: finalTotal,
            note: customerNote
        };

        const response = await fetch(GAS_RELAY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (tg?.HapticFeedback) {
            try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
        }

        let feeText = (tableNo === 'room') ? 
            (currentLang === 'zh' ? ` (含$${DELIVERY_FEE.toFixed(2)}運費)` : ` (Incl. $${DELIVERY_FEE.toFixed(2)} fee)`) : "";
        
        alert(`${i18nMsgs.success[currentLang] || i18nMsgs.success.zh}\n總計: $${finalTotal.toFixed(2)}${feeText}`);
        
        cart = {}; 

        if (isTG) {
            // 在 Telegram 內下單完畢直接優雅關閉小程式視窗
            setTimeout(() => {
                try { tg.close(); } catch(e) {}
            }, 600);
        } else {
            window.location.href = window.location.pathname + "?table=" + encodeURIComponent(tableNo) + "&status=done&lang=" + currentLang;
        }

    } catch (e) {
        clearTimeout(timeoutId);
        isSubmitting = false; 
        updateSummary();
        alert(i18nMsgs.error[currentLang] || i18nMsgs.error.zh);
    }
}

function setLang(lang) { 
    currentLang = lang; 
    const newUrl = window.location.pathname + "?table=" + encodeURIComponent(tableNo) + "&lang=" + lang;
    window.history.replaceState({}, document.title, newUrl);
    render(); 
}

function switchCat(index) { 
    currentCatIndex = index; 
    render(); 
    document.getElementById('content').scrollTop = 0; 
}

window.addEventListener('load', () => {
    cart = {}; 
    render();
    checkStatusDone();
});

setInterval(updateSummary, 60000);
</script>
